; Uploads are downscaled by ImageUploadService, but the original must fit first.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M

; GD needs room to hold a decoded full-size photo while resizing it.
max_execution_time = 120

expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
