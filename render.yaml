services:
  - type: web
    name: stitchspot
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Disks require a paid instance type; the free tier has no persistent storage.
    plan: starter
    healthCheckPath: /

    # Uploaded images live here. Without this disk every deploy wipes them,
    # because a container's own filesystem does not survive a restart.
    disk:
      name: uploads
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1

    envVars:
      - key: APP_NAME
        value: StitchSpot
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      # php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Set to this service's public URL, e.g. https://stitchspot.onrender.com
      - key: APP_URL
        sync: false

      - key: DB_CONNECTION
        value: mysql
      - key: MYSQL_ATTR_SSL_CA
        value: database/certs/aiven-ca.pem
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: local

      # Password reset emails will not arrive until these are real.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

      - key: BROADCAST_DRIVER
        value: pusher
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_APP_KEY
        sync: false
      - key: PUSHER_APP_SECRET
        sync: false
      - key: PUSHER_APP_CLUSTER
        sync: false

      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
